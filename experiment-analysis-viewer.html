<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyph Trajectory Observatory</title>
<style>
:root{--bg:#090b0d;--panel:#12171b;--ink:#e8e2d4;--muted:#8f9a9b;--line:#293136;--signal:#a7e36e;--source:#6fc7de;--error:#ff9d8e}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{padding:18px 22px;border-bottom:1px solid var(--line)} h1{font-size:18px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px} .sub{color:var(--muted)}
.controls{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)} label{color:var(--muted);font-size:12px} select,input,textarea,button{width:100%;margin-top:5px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:9px;font:inherit} input[type=range]{padding:0;accent-color:var(--signal)}
main{padding:20px 22px}.stage{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pane{min-width:0;border-top:2px solid var(--source);padding-top:10px}.pane.result{border-color:var(--signal)}.pane h2{font-size:12px;font-weight:400;color:var(--muted);margin:0 0 12px;text-transform:uppercase;letter-spacing:.1em}.specimen{font-size:clamp(30px,5vw,68px);line-height:1.15;min-height:190px;overflow-wrap:anywhere}.overlay{position:relative;min-height:150px;border-top:1px solid var(--line);margin-top:18px;padding-top:18px}.overlay-text{position:absolute;inset:18px 0 auto;font-size:clamp(34px,6vw,78px);line-height:1.1;overflow-wrap:anywhere}.overlay .src{color:var(--source);opacity:.42}.overlay .dst{color:var(--signal);opacity:.58;mix-blend-mode:screen}
.timeline{margin:18px 0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}.step{color:var(--signal);min-width:5ch;text-align:right}.details{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--line);padding-top:18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}.metric{background:var(--panel);padding:10px}.metric b{display:block;color:var(--signal);font-size:18px;font-weight:400}.metric span{color:var(--muted);font-size:11px}.meta{margin:0;white-space:pre-wrap;color:var(--muted);font-size:12px}.status{color:var(--muted);padding:10px 22px}.status.error{color:var(--error)}
@media(max-width:720px){.controls,.stage,.details{grid-template-columns:1fr}.specimen{min-height:110px}.timeline{grid-template-columns:1fr}.step{text-align:left}.metrics{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Glyph Trajectory Observatory</h1><div class="sub">Source, state, and measurable geometric change</div></header>
<div class="controls">
  <label>Experiment series<select id="series"></select></label>
  <label>Specimen<textarea id="text" rows="2">Change the space.</textarea></label>
  <label>Glyph focus<input id="glyph" value="AaGgRr&amp;8" maxlength="24"></label>
</div>
<div id="status" class="status" role="status" aria-live="polite">Loading experiment index…</div>
<main id="app" hidden>
  <div class="timeline"><span id="kind">trajectory</span><input id="slider" type="range" min="0" max="0" value="0" aria-label="Experiment step"><span id="step" class="step">000</span></div>
  <section class="stage">
    <div class="pane"><h2>Source</h2><div id="sourceView" class="specimen"></div></div>
    <div class="pane result"><h2 id="resultTitle">Result</h2><div id="resultView" class="specimen"></div></div>
  </section>
  <section class="overlay" aria-label="Source and result overlay"><div id="overlaySource" class="overlay-text src"></div><div id="overlayResult" class="overlay-text dst"></div></section>
  <section class="details">
    <div><h2>Geometric measurements</h2><div id="metrics" class="metrics"></div></div>
    <div><h2>Provenance</h2><pre id="metadata" class="meta">No sidecar metadata for this state.</pre></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);let records=[],series=[],active=[],families=new Set();
function family(path){const name='obs_'+path.replace(/[^a-z0-9]/gi,'_');if(!families.has(name)){const style=document.createElement('style');style.textContent=`@font-face{font-family:"${name}";src:url("${path}") format("truetype");font-display:swap}`;document.head.appendChild(style);families.add(name)}return `"${name}",serif`}
function setText(){const text=($('text').value+'\n'+$('glyph').value).trim();for(const id of ['sourceView','resultView','overlaySource','overlayResult'])$(id).textContent=text}
function metric(label,value){return `<div class="metric"><b>${value??'—'}</b><span>${label}</span></div>`}
function showMetrics(data){const out=data?.measurements?.output;if(!out){$('metrics').innerHTML=metric('metadata','unavailable');return}const box=out.bounding_box;const width=box?box.x_max-box.x_min:null;const height=box?box.y_max-box.y_min:null;$('metrics').innerHTML=metric('points',out.points)+metric('contours',out.contours)+metric('contour length',out.total_contour_length)+metric('bbox width',width)+metric('bbox height',height)+metric('mean advance',out.advance_width?.mean)}
async function render(index){const item=active[index];if(!item)return;$('step').textContent=String(item.step??index).padStart(3,'0');$('resultTitle').textContent=item.name;$('resultView').style.fontFamily=family(item.path);$('overlayResult').style.fontFamily=family(item.path);const source=item.source;if(source){$('sourceView').style.fontFamily=family(source);$('overlaySource').style.fontFamily=family(source)}else{$('sourceView').style.fontFamily='serif';$('overlaySource').style.fontFamily='serif'}setText();let data=null;if(item.metadata){try{const response=await fetch(item.metadata,{cache:'no-store'});if(response.ok)data=await response.json()}catch(error){console.warn(error)}}showMetrics(data);$('metadata').textContent=data?JSON.stringify({transform:data.transform,parameters:data.parameters,sequence_kind:data.sequence_kind,source_sha256:data.source_sha256,output_sha256:data.output_sha256,claim_scope:data.claim_scope},null,2):'No sidecar metadata for this state.'}
function selectSeries(){active=records.filter(r=>r.series===$('series').value).sort((a,b)=>(a.step??0)-(b.step??0));$('slider').max=Math.max(0,active.length-1);$('slider').value=0;$('kind').textContent=`${active.length} states`;render(0)}
async function boot(){try{const response=await fetch('experiment-index.json',{cache:'no-store'});if(!response.ok)throw new Error('Run python make-experiment-index.py first.');records=(await response.json()).fonts;series=[...new Set(records.map(r=>r.series))].sort();$('series').innerHTML=series.map(name=>`<option>${name}</option>`).join('');$('status').hidden=true;$('app').hidden=false;selectSeries()}catch(error){$('status').className='status error';$('status').textContent=error.message}}
$('series').addEventListener('change',selectSeries);$('slider').addEventListener('input',event=>render(Number(event.target.value)));$('text').addEventListener('input',setText);$('glyph').addEventListener('input',setText);boot();
</script>
</body>
</html>
