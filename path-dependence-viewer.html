<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Path Dependence Comparator</title>
<style>:root{--bg:#090b0d;--panel:#12171b;--ink:#eee8da;--muted:#8e999a;--line:#293136;--a:#75cde2;--b:#b4e67c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}header{padding:20px;border-bottom:1px solid var(--line)}h1{font-size:19px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 14px}select,input,textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{color:var(--muted)}main{padding:20px}.slider{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:20px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pane{border-top:2px solid var(--a);padding-top:10px;min-width:0}.pane:last-child{border-color:var(--b)}h2{font-size:12px;color:var(--muted);font-weight:400}.sample{font-size:clamp(34px,7vw,82px);line-height:1.15;min-height:240px;overflow-wrap:anywhere}.note{color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:12px}.status{padding:16px;color:var(--muted)}@media(max-width:650px){.controls,.compare{grid-template-columns:1fr}.sample{min-height:130px}.slider{grid-template-columns:1fr}}</style></head>
<body><header><h1>Path Dependence Comparator</h1><div class="controls"><label>Source<select id="source"></select></label><label>Specimen<textarea id="text" rows="1">Order changes the outcome.</textarea></label></div></header><div id="status" class="status" role="status">Loading index…</div><main id="main" hidden><div class="slider"><span>shared intensity</span><input id="step" type="range" min="0" max="0" value="0"><output id="value">000</output></div><div class="compare"><section class="pane"><h2>Wave, then grid</h2><div id="a" class="sample"></div></section><section class="pane"><h2>Grid, then wave</h2><div id="b" class="sample"></div></section></div><div id="note" class="note">The same two operators and nominal intensity; only their order differs.</div></main>
<script>
const $=x=>document.getElementById(x);let fonts=[],pathA=[],pathB=[],families=new Set();function family(path){const n='pd_'+path.replace(/[^a-z0-9]/gi,'_');if(!families.has(n)){const s=document.createElement('style');s.textContent=`@font-face{font-family:"${n}";src:url("${path}") format("truetype");font-display:swap}`;document.head.appendChild(s);families.add(n)}return `"${n}",serif`}
function draw(){const i=+$('step').value,text=$('text').value;$('value').textContent=String(i).padStart(3,'0');for(const [id,row] of [['a',pathA],['b',pathB]]){const item=row[i];$(id).textContent=text;if(item)$(id).style.fontFamily=family(item.path)}}function choose(){const s=$('source').value;pathA=fonts.filter(x=>x.source===s&&x.group.includes('order-effects/wave_then_grid')).sort((a,b)=>a.step-b.step);pathB=fonts.filter(x=>x.source===s&&x.group.includes('order-effects/grid_then_wave')).sort((a,b)=>a.step-b.step);$('step').max=Math.max(0,Math.min(pathA.length,pathB.length)-1);$('step').value=0;draw()}
async function boot(){try{const r=await fetch('experiment-index.json',{cache:'no-store'});if(!r.ok)throw Error('Run python make-experiment-index.py first.');fonts=(await r.json()).fonts.filter(x=>x.root==='experiments-v02');const ss=[...new Set(fonts.map(x=>x.source).filter(Boolean))].sort();$('source').innerHTML=ss.map(x=>`<option>${x}</option>`).join('');$('status').hidden=true;$('main').hidden=false;choose()}catch(e){$('status').textContent=e.message}}$('source').onchange=choose;$('step').oninput=draw;$('text').oninput=draw;boot();
</script></body></html>
