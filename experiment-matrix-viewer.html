<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transformation Matrix</title>
<style>
:root{--bg:#090b0d;--panel:#12171b;--ink:#eee8da;--muted:#899496;--line:#293136;--accent:#a7e36e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}header{padding:20px;border-bottom:1px solid var(--line)}h1{margin:0 0 14px;font-size:19px;letter-spacing:.12em;text-transform:uppercase}select,input,textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}label{color:var(--muted)}main{padding:18px;overflow-x:auto}.matrix{display:grid;gap:1px;background:var(--line);min-width:680px}.cell{background:var(--panel);padding:12px;min-height:105px;overflow:hidden}.head{min-height:auto;color:var(--muted);position:sticky;top:0}.rowname{color:var(--accent);overflow-wrap:anywhere}.sample{font-size:28px;line-height:1.2;overflow-wrap:anywhere}.status{padding:16px;color:var(--muted)}@media(max-width:620px){.controls{grid-template-columns:1fr}main{padding:10px}.cell{padding:9px}}
</style></head>
<body><header><h1>Transformation Matrix</h1><div class="controls"><label>Source font<select id="source"></select></label><label>Columns<select id="columns"><option value="5">5 states</option><option value="8">8 states</option><option value="3">3 states</option></select></label><label>Specimen<textarea id="text" rows="1">Change the space.</textarea></label></div></header><div id="status" class="status" role="status">Loading index…</div><main id="main" hidden><div id="matrix" class="matrix"></div></main>
<script>
const $=x=>document.getElementById(x);let fonts=[],families=new Set();function ff(path){const n='mx_'+path.replace(/[^a-z0-9]/gi,'_');if(!families.has(n)){const s=document.createElement('style');s.textContent=`@font-face{font-family:"${n}";src:url("${path}") format("truetype");font-display:swap}`;document.head.appendChild(s);families.add(n)}return `"${n}",serif`}
function render(){const source=$('source').value,count=+$('columns').value,text=$('text').value;const chosen=fonts.filter(x=>x.root==='experiments-v02'&&x.source===source&&x.group.startsWith('fields/'));const groups=Object.groupBy?Object.groupBy(chosen,x=>x.series):chosen.reduce((a,x)=>((a[x.series]??=[]).push(x),a),{});const names=Object.keys(groups).sort();$('matrix').style.gridTemplateColumns=`160px repeat(${count},minmax(100px,1fr))`;$('matrix').innerHTML='<div class="cell head">operator</div>'+Array.from({length:count},(_,i)=>`<div class="cell head">state ${i}</div>`).join('')+names.map(name=>{const row=groups[name].sort((a,b)=>a.step-b.step);const picks=Array.from({length:count},(_,i)=>row[Math.round(i*(row.length-1)/Math.max(1,count-1))]);return `<div class="cell rowname">${name.replace(source.replace('.ttf','')+'_','')}</div>`+picks.map(x=>`<div class="cell sample" style="font-family:${ff(x.path)}">${text}</div>`).join('')}).join('')}
async function boot(){try{const r=await fetch('experiment-index.json',{cache:'no-store'});if(!r.ok)throw Error('Run python make-experiment-index.py first.');fonts=(await r.json()).fonts;const sources=[...new Set(fonts.filter(x=>x.root==='experiments-v02').map(x=>x.source).filter(Boolean))].sort();$('source').innerHTML=sources.map(x=>`<option>${x}</option>`).join('');$('status').hidden=true;$('main').hidden=false;render()}catch(e){$('status').textContent=e.message}}$('source').onchange=render;$('columns').onchange=render;$('text').oninput=render;boot();
</script></body></html>
